[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "astro-mcp"
version = "0.1.0"
description = "A FastMCP service for celestial body positions and moon phases using Skyfield"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "fastmcp>=3.0.0",
    "skyfield>=1.46",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[project.scripts]
astro-mcp = "astro_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/astro_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
